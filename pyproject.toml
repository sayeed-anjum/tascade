[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tascade"
version = "0.1.0"
description = "Minimal vertical-slice coordinator for agentic task orchestration."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116.0",
  "pydantic>=2.11.0",
  "sqlalchemy>=2.0.0",
  "psycopg[binary]>=3.2.0",
  "uvicorn>=0.35.0",
  "aiofiles>=24.0.0",
]

[project.scripts]
tascade = "app.cli.main:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "mcp>=1.13.0",
]

[tool.setuptools.packages.find]
# Flat layout: ship the application package only, not web/, tests/ or docs/.
include = ["app*"]
namespaces = false

[tool.setuptools.package-data]
# `tascade --skill` must work from an installed wheel, where there is no docs/.
"app.cli" = ["cli-skill.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
